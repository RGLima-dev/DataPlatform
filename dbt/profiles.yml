weather_dbt:
  target: ci

  outputs:
    ci:
      type: athena
      region_name: us-east-1
      database: awsdatacatalog
      schema: weather_data

      s3_staging_dir: s3://rods-data-platform-weather/athena-results/
      s3_data_dir: s3://rods-data-platform-weather/dbt/
      s3_data_naming: schema_table

      threads: 4
      num_retries: 3